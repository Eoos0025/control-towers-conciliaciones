<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Torre de Control de Conciliaciones · Nexocorp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- Pantalla de ingreso -->
<section id="pantalla-login" class="login oculto">
  <form id="form-login" autocomplete="on">
    <span class="marca">NEXOCORP</span>
    <h1 style="margin:0;font-size:22px">Torre de Control de Conciliaciones</h1>
    <p>Ingresa con la cuenta que te creó el administrador.</p>
    <label>Correo
      <input id="login-correo" type="email" autocomplete="username" required>
    </label>
    <label>Contraseña
      <input id="login-clave" type="password" autocomplete="current-password" required>
    </label>
    <button id="login-boton" class="btn-primario" type="submit">Ingresar</button>
    <p id="login-error" class="error" role="alert"></p>
    <p style="font-size:12px">¿Olvidaste tu contraseña? Pide al administrador que la restablezca.</p>
  </form>
</section>

<!-- Aplicación -->
<div id="pantalla-app" class="oculto">
  <header class="cabecera">
    <div class="contenedor">
      <div class="titulo">
        <span class="marca">NEXOCORP</span>
        <span class="sub">Torre de Control de Conciliaciones</span>
      </div>
      <nav class="pestanas" aria-label="Perspectiva">
        <a href="#/ejecutivo" id="tab-ejecutivo">Ejecutivo</a>
        <a href="#/operativo" id="tab-operativo">Operativo<span id="insignia-atrasos" class="insignia oculto"></span></a>
      </nav>
      <div class="cab-der">
        <span id="estado-datos"><span class="punto-estado" aria-hidden="true"></span>Cargando…</span>
        <button id="btn-actualizar" class="btn-cab" type="button">Actualizar</button>
        <button id="btn-salir" class="btn-cab" type="button" title="Cerrar sesión">Salir</button>
      </div>
    </div>
  </header>

  <section class="filtros" aria-label="Filtros">
    <div class="contenedor" id="filtros"></div>
  </section>

  <main class="contenedor" id="contenido">
    <div class="cargando">Cargando datos…</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/datos.js"></script>
<script src="js/calculos.js"></script>
<script src="js/vista-ejecutivo.js"></script>
<script src="js/vista-operativo.js"></script>
<script src="js/vista-ficha.js"></script>
<script src="js/app.js"></script>
</body>
</html>
